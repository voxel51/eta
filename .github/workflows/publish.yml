name: Publish

on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release # For trusted publishing. See below.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone ETA
        uses: actions/checkout@v7
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: 3
      - name: Install dependencies
        run: |
          pip install --upgrade pip build
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.ref }}
        run: |
          # The tag must match the VERSION file (vX.Y.Z), or extend it with
          # a release-candidate suffix (vX.Y.Z-rc.N), which is written to
          # VERSION for this build only.
          base_version=$(tr -d '\r\n' < VERSION)
          tag_version=${RELEASE_TAG#refs/tags/v}
          if [ "$tag_version" = "$base_version" ]; then
            :
          elif [[ "$tag_version" == "$base_version"-rc.* ]]; then
            printf '%s\n' "$tag_version" > VERSION
          else
            echo "::error::Tag $tag_version does not match VERSION $base_version"
            exit 1
          fi
          echo "Building voxel51-eta $(tr -d '\r\n' < VERSION)"
      - name: Build
        run: |
          python -m build
      # Utilize
      # [trusted publishers](https://docs.pypi.org/trusted-publishers/)
      # This will use OIDC to publish the dists/ package to pypi.
      # See
      # [voxel51-eta](https://pypi.org/manage/project/voxel51-eta/settings/publishing)
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.14.1
