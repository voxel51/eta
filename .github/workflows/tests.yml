name: Tests

on:
  push:
    branches:
      - main
      - release/v*
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone ETA
        uses: actions/checkout@v6
      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: 3
      - name: Install ETA
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest
      - name: Run tests
        run: |
          pytest tests/ -v

  test-ffmpeg:
    name: test ffmpeg ${{ matrix.ffmpeg }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ffmpeg < 5.1: -vsync must be passed through unchanged
          - ffmpeg: "4.4 (apt)"
            runner: ubuntu-22.04
            install: sudo apt-get update && sudo apt-get install -y ffmpeg
          # -fps_mode era release
          - ffmpeg: "8.1 (BtbN)"
            runner: ubuntu-latest
            install: |
              curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar xJ
              echo "$PWD/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin" >> $GITHUB_PATH
          # git master: -vsync is removed; the -fps_mode translation must kick in
          - ffmpeg: "git master (BtbN)"
            runner: ubuntu-latest
            install: |
              curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ
              echo "$PWD/ffmpeg-master-latest-linux64-gpl/bin" >> $GITHUB_PATH
    steps:
      - name: Clone ETA
        uses: actions/checkout@v6
      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: 3
      - name: Install ffmpeg
        run: ${{ matrix.install }}
      - name: Show ffmpeg version
        run: ffmpeg -version | head -1
      - name: Install ETA
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest
      - name: Run tests
        run: |
          pytest tests/ -v
